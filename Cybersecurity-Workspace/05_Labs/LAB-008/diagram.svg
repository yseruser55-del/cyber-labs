<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="Segoe UI, Arial, sans-serif">
  <rect width="800" height="380" fill="#f7f5ef"/>
  <text x="400" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1a2332">LAB-008 — Failed Login Analyzer (Python)</text>
  <text x="400" y="62" text-anchor="middle" font-size="14" fill="#5a6372">auth.log → regex задаргаа → тоолох → босго давсныг тэмдэглэх</text>

  <!-- log -->
  <rect x="50" y="120" width="180" height="150" rx="10" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
  <text x="140" y="146" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2332">auth.log</text>
  <text x="140" y="172" text-anchor="middle" font-size="10" fill="#5a6372">Failed password root</text>
  <text x="140" y="190" text-anchor="middle" font-size="10" fill="#5a6372">from 192.168.56.10</text>
  <text x="140" y="214" text-anchor="middle" font-size="10" fill="#5a6372">Failed password admin</text>
  <text x="140" y="232" text-anchor="middle" font-size="10" fill="#5a6372">from 203.0.113.9 ...</text>

  <line x1="230" y1="195" x2="285" y2="195" stroke="#6366f1" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- script -->
  <rect x="295" y="130" width="210" height="130" rx="10" fill="#eef0fd" stroke="#a855f7" stroke-width="2"/>
  <text x="400" y="158" text-anchor="middle" font-size="14" font-weight="700" fill="#6b21a8">analyzer.py</text>
  <text x="400" y="184" text-anchor="middle" font-size="11" fill="#5a6372">1) regex-ээр IP/user ялга</text>
  <text x="400" y="206" text-anchor="middle" font-size="11" fill="#5a6372">2) Counter-аар тоол</text>
  <text x="400" y="228" text-anchor="middle" font-size="11" fill="#5a6372">3) босго ≥5 → сэжигтэй</text>

  <line x1="505" y1="195" x2="560" y2="195" stroke="#a855f7" stroke-width="2.5" marker-end="url(#b)"/>

  <!-- report -->
  <rect x="570" y="120" width="190" height="150" rx="10" fill="#fdeaea" stroke="#ef4444" stroke-width="2"/>
  <text x="665" y="146" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">REPORT</text>
  <text x="665" y="174" text-anchor="middle" font-size="11" fill="#1a2332">192.168.56.10 → 7 🚨</text>
  <text x="665" y="196" text-anchor="middle" font-size="11" fill="#1a2332">203.0.113.9 → 6 🚨</text>
  <text x="665" y="224" text-anchor="middle" font-size="11" fill="#5a6372">2 сэжигтэй IP</text>
  <text x="665" y="246" text-anchor="middle" font-size="10" fill="#5a6372">→ firewall дээр хаа</text>

  <text x="400" y="330" text-anchor="middle" font-size="13" fill="#5a6372">Гар ажиллагааг (LAB-007) автоматжуулна → минутаас секунд болно</text>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#6366f1"/></marker>
    <marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#a855f7"/></marker>
  </defs>
</svg>
