<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="Segoe UI, Arial, sans-serif">
  <rect width="800" height="380" fill="#f7f5ef"/>
  <text x="400" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1a2332">LAB-003 — VirtualBox Isolated Lab + Snapshot</text>
  <text x="400" y="62" text-anchor="middle" font-size="14" fill="#5a6372">Host OS дээр тусгаарлагдсан Guest VM + эргэж болох snapshot</text>

  <!-- Host -->
  <rect x="60" y="90" width="680" height="220" rx="14" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
  <text x="80" y="116" font-size="15" font-weight="700" fill="#1a2332">💻 Host OS — Windows (таны компьютер)</text>

  <!-- Hypervisor -->
  <rect x="80" y="130" width="640" height="160" rx="10" fill="#eef0fd" stroke="#a855f7" stroke-width="1.5"/>
  <text x="96" y="152" font-size="13" font-weight="700" fill="#6b21a8">Hypervisor — VirtualBox</text>

  <!-- Guest VM -->
  <rect x="110" y="165" width="300" height="110" rx="10" fill="#ffffff" stroke="#22c55e" stroke-width="2"/>
  <text x="260" y="192" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2332">🐧 Guest OS — Ubuntu</text>
  <text x="260" y="214" text-anchor="middle" font-size="12" fill="#5a6372">RAM 3GB · Disk 25GB</text>
  <text x="260" y="234" text-anchor="middle" font-size="12" fill="#5a6372">Network: Host-only (тусгаарлагдсан)</text>
  <text x="260" y="256" text-anchor="middle" font-size="11" fill="#15803d">Энд бүх security лаб хийгдэнэ</text>

  <!-- Snapshot -->
  <rect x="440" y="165" width="250" height="110" rx="10" fill="#fff8e8" stroke="#f59e0b" stroke-width="2"/>
  <text x="565" y="192" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2332">📸 Snapshot</text>
  <text x="565" y="214" text-anchor="middle" font-size="12" fill="#5a6372">"clean-install"</text>
  <text x="565" y="236" text-anchor="middle" font-size="11" fill="#92600c">Алдаа гарвал энэ цэг рүү</text>
  <text x="565" y="252" text-anchor="middle" font-size="11" fill="#92600c">хором зуур буцаана</text>

  <line x1="410" y1="220" x2="438" y2="220" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#a)"/>

  <text x="400" y="340" text-anchor="middle" font-size="12" fill="#5a6372">Тусгаарлалт (isolation): VM доторх үйлдэл host-д нөлөөлөхгүй, malware гадагш гарахгүй</text>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#f59e0b"/></marker></defs>
</svg>
