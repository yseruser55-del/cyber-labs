<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="Segoe UI, Arial, sans-serif">
  <rect width="800" height="380" fill="#f7f5ef"/>
  <text x="400" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1a2332">LAB-001 — TCP 3-Way Handshake (Wireshark)</text>
  <text x="400" y="62" text-anchor="middle" font-size="14" fill="#5a6372">Холболт эхлэхэд солилцдог 3 пакетыг loopback (127.0.0.1) дээр барьж харна</text>

  <!-- Client -->
  <rect x="70" y="100" width="170" height="54" rx="10" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
  <text x="155" y="126" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2332">Client (browser)</text>
  <text x="155" y="144" text-anchor="middle" font-size="12" fill="#5a6372">127.0.0.1</text>
  <line x1="155" y1="154" x2="155" y2="340" stroke="#c9ccd6" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Server -->
  <rect x="560" y="100" width="170" height="54" rx="10" fill="#ffffff" stroke="#a855f7" stroke-width="2"/>
  <text x="645" y="126" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2332">Server (Flask)</text>
  <text x="645" y="144" text-anchor="middle" font-size="12" fill="#5a6372">port 5000</text>
  <line x1="645" y1="154" x2="645" y2="340" stroke="#c9ccd6" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- SYN -->
  <line x1="155" y1="195" x2="640" y2="195" stroke="#6366f1" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="400" y="188" text-anchor="middle" font-size="14" font-weight="700" fill="#6366f1">1. SYN →</text>
  <text x="400" y="211" text-anchor="middle" font-size="11" fill="#5a6372">"Холбогдъё"</text>

  <!-- SYN-ACK -->
  <line x1="645" y1="250" x2="160" y2="250" stroke="#a855f7" stroke-width="2.5" marker-end="url(#b)"/>
  <text x="400" y="243" text-anchor="middle" font-size="14" font-weight="700" fill="#a855f7">← 2. SYN, ACK</text>
  <text x="400" y="266" text-anchor="middle" font-size="11" fill="#5a6372">"За, би бэлэн"</text>

  <!-- ACK -->
  <line x1="155" y1="305" x2="640" y2="305" stroke="#22c55e" stroke-width="2.5" marker-end="url(#c)"/>
  <text x="400" y="298" text-anchor="middle" font-size="14" font-weight="700" fill="#22c55e">3. ACK →</text>
  <text x="400" y="321" text-anchor="middle" font-size="11" fill="#5a6372">"Баталгаажлаа → холболт үүслээ"</text>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#6366f1"/></marker>
    <marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#a855f7"/></marker>
    <marker id="c" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#22c55e"/></marker>
  </defs>
</svg>
