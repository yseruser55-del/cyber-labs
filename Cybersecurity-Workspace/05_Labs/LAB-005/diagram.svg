<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="Segoe UI, Arial, sans-serif">
  <rect width="800" height="380" fill="#f7f5ef"/>
  <text x="400" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1a2332">LAB-005 — Hashing &amp; Avalanche Effect</text>
  <text x="400" y="62" text-anchor="middle" font-size="14" fill="#5a6372">1 үсэг өөрчлөгдөхөд SHA-256 бараг бүхэлдээ өөрчлөгдөнө</text>

  <!-- input 1 -->
  <rect x="60" y="110" width="200" height="50" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
  <text x="160" y="140" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2332">"hello world"</text>

  <!-- hash box -->
  <rect x="330" y="100" width="140" height="180" rx="10" fill="#eef0fd" stroke="#a855f7" stroke-width="2"/>
  <text x="400" y="185" text-anchor="middle" font-size="15" font-weight="700" fill="#6b21a8">SHA-256</text>
  <text x="400" y="205" text-anchor="middle" font-size="11" fill="#5a6372">нэг чиглэлт</text>

  <!-- input 2 -->
  <rect x="60" y="230" width="200" height="50" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
  <text x="160" y="260" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2332">"Hello world"</text>
  <text x="160" y="300" text-anchor="middle" font-size="11" fill="#ef4444">↑ зөвхөн h→H</text>

  <line x1="260" y1="135" x2="328" y2="160" stroke="#6366f1" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="260" y1="255" x2="328" y2="220" stroke="#6366f1" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- output 1 -->
  <rect x="500" y="110" width="240" height="56" rx="8" fill="#e9f9ef" stroke="#22c55e" stroke-width="2"/>
  <text x="620" y="133" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">b94d27b9934d3e08...</text>
  <text x="620" y="153" text-anchor="middle" font-size="11" fill="#5a6372">(64 тэмдэгт hash)</text>

  <!-- output 2 -->
  <rect x="500" y="224" width="240" height="56" rx="8" fill="#fdeaea" stroke="#ef4444" stroke-width="2"/>
  <text x="620" y="247" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">6f5902ac237024bd...</text>
  <text x="620" y="267" text-anchor="middle" font-size="11" fill="#5a6372">огт өөр hash!</text>

  <line x1="470" y1="150" x2="498" y2="140" stroke="#22c55e" stroke-width="2.5" marker-end="url(#b)"/>
  <line x1="470" y1="230" x2="498" y2="248" stroke="#ef4444" stroke-width="2.5" marker-end="url(#c)"/>

  <text x="400" y="345" text-anchor="middle" font-size="13" fill="#5a6372">Файл өөрчлөгдвөл hash өөрчлөгдөнө → integrity (бүрэн бүтэн байдал) шалгана</text>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#6366f1"/></marker>
    <marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#22c55e"/></marker>
    <marker id="c" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#ef4444"/></marker>
  </defs>
</svg>
