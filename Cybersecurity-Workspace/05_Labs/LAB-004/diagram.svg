<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="Segoe UI, Arial, sans-serif">
  <rect width="800" height="380" fill="#f7f5ef"/>
  <text x="400" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1a2332">LAB-004 — Linux Permissions (rwx)</text>
  <text x="400" y="62" text-anchor="middle" font-size="14" fill="#5a6372">chmod 640 /opt/report.txt → хэн юу хийж чадахыг хянана</text>

  <!-- file -->
  <rect x="250" y="88" width="300" height="46" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
  <text x="400" y="117" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2332">-rw- r-- --- (640)</text>

  <!-- owner -->
  <rect x="70" y="165" width="200" height="130" rx="10" fill="#e9f9ef" stroke="#22c55e" stroke-width="2"/>
  <text x="170" y="190" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">Owner: root</text>
  <text x="170" y="216" text-anchor="middle" font-size="22" font-weight="700" fill="#15803d">rw-</text>
  <text x="170" y="244" text-anchor="middle" font-size="12" fill="#5a6372">уншина + бичнэ (6)</text>

  <!-- group -->
  <rect x="300" y="165" width="200" height="130" rx="10" fill="#fff8e8" stroke="#f59e0b" stroke-width="2"/>
  <text x="400" y="190" text-anchor="middle" font-size="14" font-weight="700" fill="#92600c">Group: soc</text>
  <text x="400" y="216" text-anchor="middle" font-size="22" font-weight="700" fill="#92600c">r--</text>
  <text x="400" y="244" text-anchor="middle" font-size="12" fill="#5a6372">зөвхөн уншина (4)</text>

  <!-- other -->
  <rect x="530" y="165" width="200" height="130" rx="10" fill="#fdeaea" stroke="#ef4444" stroke-width="2"/>
  <text x="630" y="190" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c">Other: бусад</text>
  <text x="630" y="216" text-anchor="middle" font-size="22" font-weight="700" fill="#b91c1c">---</text>
  <text x="630" y="244" text-anchor="middle" font-size="12" fill="#5a6372">юу ч үгүй (0)</text>

  <text x="400" y="340" text-anchor="middle" font-size="13" fill="#5a6372">Least privilege: зөвхөн шаардлагатай эрхийг олго → аюулгүй байдлын суурь</text>
</svg>
