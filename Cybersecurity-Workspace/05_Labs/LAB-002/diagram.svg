<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="Segoe UI, Arial, sans-serif">
  <rect width="800" height="380" fill="#f7f5ef"/>
  <text x="400" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1a2332">LAB-002 — Nmap Port Scan (127.0.0.1)</text>
  <text x="400" y="62" text-anchor="middle" font-size="14" fill="#5a6372">Аль порт нээлттэй (сонсож буй) байгааг илрүүлнэ</text>

  <!-- Nmap -->
  <rect x="60" y="150" width="180" height="80" rx="12" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
  <text x="150" y="182" text-anchor="middle" font-size="16" font-weight="700" fill="#1a2332">Nmap</text>
  <text x="150" y="204" text-anchor="middle" font-size="12" fill="#5a6372">nmap -sV 127.0.0.1</text>

  <line x1="240" y1="190" x2="320" y2="190" stroke="#6366f1" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="280" y="180" text-anchor="middle" font-size="11" fill="#5a6372">probe</text>

  <!-- Target with ports -->
  <rect x="330" y="95" width="410" height="200" rx="12" fill="#fbfbfe" stroke="#a855f7" stroke-width="2"/>
  <text x="535" y="122" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2332">Target: 127.0.0.1 (миний компьютер)</text>

  <!-- ports -->
  <rect x="355" y="140" width="170" height="40" rx="8" fill="#e9f9ef" stroke="#22c55e" stroke-width="2"/>
  <text x="440" y="165" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">5000/tcp OPEN → Flask</text>

  <rect x="545" y="140" width="170" height="40" rx="8" fill="#fdeaea" stroke="#ef4444" stroke-width="1.5"/>
  <text x="630" y="165" text-anchor="middle" font-size="13" fill="#b91c1c">22/tcp closed</text>

  <rect x="355" y="195" width="170" height="40" rx="8" fill="#fdeaea" stroke="#ef4444" stroke-width="1.5"/>
  <text x="440" y="220" text-anchor="middle" font-size="13" fill="#b91c1c">80/tcp closed</text>

  <rect x="545" y="195" width="170" height="40" rx="8" fill="#fdeaea" stroke="#ef4444" stroke-width="1.5"/>
  <text x="630" y="220" text-anchor="middle" font-size="13" fill="#b91c1c">443/tcp closed</text>

  <text x="535" y="268" text-anchor="middle" font-size="12" fill="#5a6372">Нээлттэй порт бүр = боломжит довтолгооны гарц → илүүдлийг хаа</text>

  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#6366f1"/></marker></defs>
</svg>
